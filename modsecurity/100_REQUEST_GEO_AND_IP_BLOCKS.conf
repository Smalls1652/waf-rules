SecRule REMOTE_ADDR "@geoLookup" "phase:1,chain,id:100,drop,log,msg:'Blocking Country IP Address'"
SecRule GEO:COUNTRY_CODE "@pm RU CN SG" "msg:'Blocked Country',logdata:'%{MATCHED_VAR}'"

SecRule REMOTE_ADDR "@ipMatchFromFile blocked_ip_ranges.data" \
    "id:101, \
    phase:1, \
    deny, \
    status:403, \
    msg:'Blocked IP Address Range', \
    logdata:'Matched Data: %{REMOTE_ADDR}'"
